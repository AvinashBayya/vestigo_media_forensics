[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vestigo-media-forensics"
description = "Local-first media provenance and verification service."
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30",
  "pillow>=10.4",
  "imagehash>=4.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not container'"
filterwarnings = [
  # Starlette's TestClient prefers httpx2; httpx is the documented test dependency (10-DEPENDENCIES.md).
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  # Expected: pixel-limit tests use images Pillow flags before Vestigo rejects them.
  "ignore::PIL.Image.DecompressionBombWarning",
  # Expected: the corrupt-EXIF fixture is deliberately malformed.
  "ignore:Corrupt EXIF data:UserWarning",
]
markers = [
  "container: checks the Dev Container environment and ports (run with: pytest -m container)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
