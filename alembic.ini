# Developer use only: the application migrates its database at startup (app/core/migrations.py).
# Examples, run from the repository root:
#   alembic current
#   alembic revision -m "describe the change"
# The database is $VESTIGO_DATA_DIR/app.db (default data/app.db).

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
